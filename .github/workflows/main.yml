name: Build and Deploy to Itch

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master

jobs:
  buildAndDeploy:
    name: Build & Upload 🚀
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the project code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Cache Unity Library folder to make future builds way faster
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL
          restore-keys: Library-

      # 3. Build the WebGL package using GameCI
      - name: Build Unity WebGL Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: build

      # 4. Push to Itch.io using a maintained Butler action
      - name: Deploy to Itch.io
        uses: manateeworks/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_GAME: sts-clone
          ITCH_USER: Kingslayerrq
          PACKAGE: build/WebGL