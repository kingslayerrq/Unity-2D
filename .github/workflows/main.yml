name: Build and Deploy to Itch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: itch-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndDeploy:
    name: Build & Upload 🚀
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          docker system prune -af
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-WebGL-
            Library-${{ runner.os }}-

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          artifactsPath: test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-test-results
          path: test-results
          if-no-files-found: warn

      # unity-builder refuses to version a dirty checkout; drop the
      # untracked test output (written as root by the test container).
      - name: Clean test output
        run: sudo rm -rf test-results

      - name: Build Unity WebGL Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: build

      - name: Validate WebGL output
        shell: bash
        run: test -f build/WebGL/WebGL/index.html

      - name: Setup Butler 🎩
        uses: jdno/setup-butler@v1

      - name: Upload to Itch.io 🚀
        run: butler push build/WebGL/WebGL Kingslayerrq/sts-clone:html5
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
